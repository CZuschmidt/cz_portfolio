# =============================================================================
#  ACTIVITIES — clubs, teams, research, jobs, teaching, volunteering.
#  Shown in the "Activities" section, in the order listed here.
#
#  HOW TO ADD AN ACTIVITY
#    1. Copy the block between the two lines below.
#    2. Paste it where you want the activity to appear (top = first).
#    3. Fill in the fields. Only `role` and `dates` are required; delete any
#       optional line you don't need.
#
#  ---- copy from here --------------------------------------------------------
#  - role: "Your role"
#    organization: "Organization name"           # optional
#    dates: "Sep 2024 – Present"
#    location: "City, ST"                        # optional
#    description: >-                             # optional, Markdown allowed
#      One or two sentences about the group and what you do there.
#    highlights:                                 # optional bullet points
#      - "Something specific you did, with a number if you have one."
#      - "Another specific contribution."
#    link: "https://example.org"                 # optional (or a project page, e.g. "/projects/my-project/")
#    link_label: "Team website"                  # optional text for the link
#  ---- to here ---------------------------------------------------------------
#
#  Indentation matters in YAML: keep two spaces before every field after the
#  first, and four spaces before each highlight, exactly as in the examples.
# =============================================================================

