<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>.blk{fill:#fff;stroke:#111;stroke-width:3}.t{font:600 34px Helvetica,Arial,sans-serif;fill:#111}.cap{font:28px Helvetica,Arial,sans-serif;fill:#555}.ar{stroke:#111;stroke-width:3;fill:none}.reg{fill:none;stroke:#ea580c;stroke-width:3;stroke-dasharray:14 10}.rl{font:600 30px Helvetica,Arial,sans-serif;fill:#c2410c}.mono{font:30px Menlo,Consolas,monospace;fill:#111}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
<rect class="blk" x="90" y="400" width="250" height="180"/><text class="mono" x="215.0" y="500" text-anchor="middle">program.j</text>
<text class="cap" x="215" y="636" text-anchor="middle">J source</text>
